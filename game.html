<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Junior's: Nightfall</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050508;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #101018;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Overlay */
        .hud-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border: 2px solid #00ffff;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .hud-text {
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .hud-text:last-child {
            margin-bottom: 0;
        }

        /* Office Controls Buttons */
        .btn {
            position: absolute;
            padding: 14px 22px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border: 2px solid;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            z-index: 10;
            transition: background 0.1s, transform 0.05s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #btn-shutter {
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: #331010;
            color: #ff3333;
            border-color: #ff3333;
        }

        #btn-flash {
            bottom: 110px;
            right: 40px;
            background: #333010;
            color: #ffff33;
            border-color: #ffff33;
        }

        #btn-vent {
            bottom: 110px;
            left: 40px;
            background: #102033;
            color: #33ffff;
            border-color: #33ffff;
        }

        #btn-monitor {
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background: #103310;
            color: #33ff33;
            border-color: #33ff33;
            text-align: center;
        }

        .btn:active, .btn.active {
            filter: brightness(1.6);
        }

        #btn-shutter.active {
            transform: translateX(-50%) scale(0.96);
            background: #ff3333;
            color: #000;
        }

        #btn-vent.active {
            transform: scale(0.96);
            background: #33ffff;
            color: #000;
        }

        /* Security Monitor Interface */
        #monitor-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 15, 5, 0.96);
            z-index: 20;
            border: 12px solid #1a1a1a;
        }

        #cam-title {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #33ff33;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 8px #33ff33;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 420px;
        }

        .cam-btn {
            background: #0a1a0a;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-radius: 3px;
        }

        .cam-btn:hover {
            background: #153315;
        }

        .cam-btn.active {
            background: #33ff33;
            color: #000;
        }

        /* Air Duct Control Panel */
        #duct-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 320px;
            height: 290px;
            background: rgba(0, 25, 0, 0.85);
            border: 2px solid #33ff33;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.15);
        }

        .duct-header {
            color: #33ff33;
            border-bottom: 1px solid #33ff33;
            padding-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        #duct-map-draw {
            height: 150px;
            margin: 12px 0;
            border: 1px dashed #33ff33;
            position: relative;
            background: rgba(0, 10, 0, 0.5);
        }

        .duct-label {
            position: absolute;
            color: #33ff33;
            font-size: 11px;
            font-weight: bold;
        }

        .duct-gate-btn {
            background: #003300;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 8px;
            margin-top: 6px;
            cursor: pointer;
            width: 100%;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            border-radius: 3px;
        }

        .duct-gate-btn:hover {
            background: #005500;
        }

        /* Noise & Hallucination Overlays */
        #static-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.15;
            z-index: 30;
        }

        #shadow-junior {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            z-index: 25;
            text-align: center;
            line-height: 100vh;
            font-size: 72px;
            font-weight: bold;
            font-family: sans-serif;
            letter-spacing: 12px;
            text-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="viewboard"></canvas>
    <canvas id="static-canvas"></canvas>

    <!-- Heads Up Display -->
    <div class="hud-panel">
        <div class="hud-text" id="hud-clock">TIME: 12 AM</div>
        <div class="hud-text" id="hud-power">POWER: 100.0%</div>
        <div class="hud-text" id="hud-usage">USAGE: LOW</div>
    </div>

    <!-- Interactive Office Controls -->
    <button class="btn" id="btn-vent">HOLD VENT SEAL</button>
    <button class="btn" id="btn-shutter">TOGGLE SHUTTER</button>
    <button class="btn" id="btn-flash">FLASH BEACON</button>
    <button class="btn" id="btn-monitor">TOGGLE MONITOR</button>

    <!-- Monitor Subsystem Interface -->
    <div id="monitor-overlay">
        <div id="cam-title">CAM 01: ARCADE FLOOR</div>
        
        <!-- Overhead Air Duct Control Panel -->
        <div id="duct-panel">
            <div class="duct-header">AIR DUCT RADAR & GATES</div>
            <div id="duct-map-draw">
                <div class="duct-label" style="top: 15px; left: 15px;">DUCT A</div>
                <div class="duct-label" style="top: 65px; left: 110px;">DUCT B</div>
                <div class="duct-label" style="top: 115px; left: 205px;">DUCT C</div>
            </div>
            <button class="duct-gate-btn" id="gate-1-toggle">GATE 1: NORMAL</button>
            <button class="duct-gate-btn" id="gate-2-toggle">GATE 2: NORMAL</button>
        </div>

        <!-- Camera Switcher Grid -->
        <div class="cam-grid">
            <button class="cam-btn active" onclick="switchCam('CAM01', 'CAM 01: Arcade Floor')">CAM 01</button>
            <button class="cam-btn" onclick="switchCam('CAM02', 'CAM 02: Party Rooms')">CAM 02</button>
            <button class="cam-btn" onclick="switchCam('CAM03', 'CAM 03: Bowling Lanes')">CAM 03</button>
            <button class="cam-btn" onclick="switchCam('CAM04', 'CAM 04: Prize Counter')">CAM 04</button>
            <button class="cam-btn" onclick="switchCam('CAM05', 'CAM 05: Ball Pit Area')">CAM 05</button>
            <button class="cam-btn" onclick="switchCam('CAM06', 'CAM 06: Backstage Closet')">CAM 06</button>
            <button class="cam-btn" onclick="switchCam('CAM07', 'CAM 07: Storage Room')">CAM 07</button>
            <button class="cam-btn" onclick="switchCam('CAM08', 'CAM 08: Duct Main Entry')">CAM 08</button>
        </div>
    </div>

    <!-- Hallucination Screen Overlay -->
    <div id="shadow-junior">J U N I O R</div>
</div>

<script>
    // Audio Context Synthesizer for Audio Feedback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Game Logic State Core
    const state = {
        power: 100.0,
        time: 0, // 0 to 360 seconds (6 minutes total)
        shutterClosed: false,
        ventSealHeld: false,
        ventHoldTimer: 0,
        flashActive: false,
        monitorActive: false,
        currentCam: 'CAM01',
        gate1Diverted: false,
        gate2Diverted: false,
        blackout: false,
        gameOver: false,
        shadowActive: false,
        shadowTimer: 0
    };

    // Animatronic AI Tracker
    const animatronics = {
        junior: { loc: 'CAM06', timer: 0, killTimer: 0 },
        jolly: { loc: 'CAM06', timer: 0, killTimer: 0 },
        jingle: { loc: 'CAM07', timer: 0, killTimer: 0 }
    };

    // Render Canvas Elements
    const canvas = document.getElementById('viewboard');
    const ctx = canvas.getContext('2d');
    const staticCanvas = document.getElementById('static-canvas');
    const sCtx = staticCanvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        staticCanvas.width = window.innerWidth;
        staticCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Controls DOM Binding
    const btnShutter = document.getElementById('btn-shutter');
    const btnFlash = document.getElementById('btn-flash');
    const btnVent = document.getElementById('btn-vent');
    const btnMonitor = document.getElementById('btn-monitor');
    const monitorOverlay = document.getElementById('monitor-overlay');
    const gate1Btn = document.getElementById('gate-1-toggle');
    const gate2Btn = document.getElementById('gate-2-toggle');
    const shadowOverlay = document.getElementById('shadow-junior');

    btnShutter.onclick = () => {
        if (state.blackout) return;
        state.shutterClosed = !state.shutterClosed;
        btnShutter.classList.toggle('active', state.shutterClosed);
        playBeep(state.shutterClosed ? 150 : 300, 'square', 0.2);
    };

    btnFlash.onclick = () => {
        if (state.blackout) return;
        state.power = Math.max(0, state.power - 1.5);
        state.flashActive = true;
        playBeep(800, 'sine', 0.1);
        setTimeout(() => state.flashActive = false, 150);

        // Flash behavior against Junior at Right Door
        if (animatronics.junior.loc === 'OFFICE_RIGHT') {
            animatronics.junior.loc = 'CAM01';
            animatronics.junior.killTimer = 0;
            playBeep(100, 'sawtooth', 0.4);
        }
    };

    btnVent.onmousedown = () => {
        if (!state.blackout) state.ventSealHeld = true;
        btnVent.classList.add('active');
    };
    btnVent.onmouseup = () => {
        state.ventSealHeld = false;
        btnVent.classList.remove('active');
    };
    btnVent.onmouseleave = () => {
        state.ventSealHeld = false;
        btnVent.classList.remove('active');
    };

    btnMonitor.onclick = () => {
        if (state.blackout) return;
        state.monitorActive = !state.monitorActive;
        monitorOverlay.style.display = state.monitorActive ? 'block' : 'none';
        btnMonitor.classList.toggle('active', state.monitorActive);
        playBeep(state.monitorActive ? 600 : 400, 'triangle', 0.15);
    };

    gate1Btn.onclick = () => {
        state.gate1Diverted = !state.gate1Diverted;
        gate1Btn.innerText = `GATE 1: ${state.gate1Diverted ? 'DIVERTED' : 'NORMAL'}`;
        playBeep(120, 'sawtooth', 0.25);
    };

    gate2Btn.onclick = () => {
        state.gate2Diverted = !state.gate2Diverted;
        gate2Btn.innerText = `GATE 2: ${state.gate2Diverted ? 'DIVERTED' : 'NORMAL'}`;
        playBeep(120, 'sawtooth', 0.25);
    };

    window.switchCam = (camID, title) => {
        state.currentCam = camID;
        document.getElementById('cam-title').innerText = title;
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        playBeep(500, 'sine', 0.05);
    };

    // Static Noise Rendering
    function renderStatic() {
        const imgData = sCtx.createImageData(staticCanvas.width, staticCanvas.height);
        const numPixels = imgData.data.length / 4;
        for (let i = 0; i < numPixels; i++) {
            const val = Math.random() * 255;
            imgData.data[i * 4] = val;
            imgData.data[i * 4 + 1] = val;
            imgData.data[i * 4 + 2] = val;
            imgData.data[i * 4 + 3] = 35; // Alpha
        }
        sCtx.putImageData(imgData, 0, 0);
    }

    // Engine Loop Initialization
    let lastTime = performance.now();
    let tickAcc = 0;

    function gameLoop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        if (!state.gameOver) {
            updateLogic(dt);
            renderOffice();
            renderStatic();
        }

        requestAnimationFrame(gameLoop);
    }

    function updateLogic(dt) {
        // Night Clock System (360 real seconds = 6 hours)
        state.time += dt;
        const hour = Math.floor(state.time / 60);
        document.getElementById('hud-clock').innerText = `TIME: ${hour === 0 ? 12 : hour} AM`;
        if (state.time >= 360) triggerWin();

        // Power Consumption Calculations
        if (!state.blackout) {
            let usageRate = 0.1; // Base power consumption
            if (state.shutterClosed) usageRate += 0.4;
            if (state.ventSealHeld) usageRate += 0.3;
            if (state.monitorActive) usageRate += 0.2;
            if (state.gate1Diverted || state.gate2Diverted) usageRate += 0.1;

            state.power -= usageRate * dt;
            document.getElementById('hud-power').innerText = `POWER: ${state.power.toFixed(1)}%`;
            document.getElementById('hud-usage').innerText = `USAGE: ${usageRate > 0.5 ? 'CRITICAL' : usageRate > 0.2 ? 'MED' : 'LOW'}`;

            if (state.power <= 0) triggerBlackout();
        }

        // AI Tick Loop Trigger
        tickAcc += dt;
        if (tickAcc >= 1.0) {
            tickAcc = 0;
            aiTick();
        }

        // Animatronic Threat Logic Checks
        // 1. Jolly (Front Window)
        if (animatronics.jolly.loc === 'OFFICE_FRONT') {
            if (state.shutterClosed) {
                animatronics.jolly.loc = 'CAM06';
                animatronics.jolly.killTimer = 0;
            } else {
                animatronics.jolly.killTimer += dt;
                if (animatronics.jolly.killTimer >= 3.5) triggerJumpscare('Jolly the Rabbit');
            }
        }

        // 2. Junior (Right Door)
        if (animatronics.junior.loc === 'OFFICE_RIGHT') {
            animatronics.junior.killTimer += dt;
            if (animatronics.junior.killTimer >= 4.0) triggerJumpscare('Junior the Bear');
        }

        // 3. Jingle (Left Vent)
        if (animatronics.jingle.loc === 'OFFICE_LEFT_VENT') {
            if (state.ventSealHeld) {
                state.ventHoldTimer += dt;
                if (state.ventHoldTimer >= 3.0) {
                    animatronics.jingle.loc = 'CAM07';
                    animatronics.jingle.killTimer = 0;
                    state.ventHoldTimer = 0;
                }
            } else {
                state.ventHoldTimer = Math.max(0, state.ventHoldTimer - dt);
            }
        }

        // 4. Shadow Junior Hallucination (CAM 04 Trigger)
        if (state.monitorActive && state.currentCam === 'CAM04' && !state.shadowActive) {
            if (Math.random() < 0.05 * dt) {
                state.shadowActive = true;
                shadowOverlay.style.display = 'block';
                state.shadowTimer = 0;
            }
        }

        if (state.shadowActive) {
            state.shadowTimer += dt;
            if (!state.monitorActive) { // Flip down monitor to clear
                state.shadowActive = false;
                shadowOverlay.style.display = 'none';
            } else if (state.shadowTimer >= 1.5) {
                state.power = Math.max(0, state.power - 15.0);
                state.shadowActive = false;
                shadowOverlay.style.display = 'none';
                playBeep(80, 'sawtooth', 0.5);
            }
        }
    }

    function aiTick() {
        if (state.blackout) return;

        // Junior Pathing Loop (10s)
        animatronics.junior.timer++;
        if (animatronics.junior.timer >= 10) {
            animatronics.junior.timer = 0;
            if (animatronics.junior.loc === 'CAM06') animatronics.junior.loc = 'CAM01';
            else if (animatronics.junior.loc === 'CAM01') animatronics.junior.loc = 'OFFICE_RIGHT';
        }

        // Jolly Pathing Loop (8s)
        animatronics.jolly.timer++;
        if (animatronics.jolly.timer >= 8) {
            animatronics.jolly.timer = 0;
            if (animatronics.jolly.loc === 'CAM06') animatronics.jolly.loc = 'CAM03';
            else if (animatronics.jolly.loc === 'CAM03') animatronics.jolly.loc = 'CAM02';
            else if (animatronics.jolly.loc === 'CAM02') animatronics.jolly.loc = 'OFFICE_FRONT';
        }

        // Jingle Pathing Loop (12s)
        animatronics.jingle.timer++;
        if (animatronics.jingle.timer >= 12) {
            animatronics.jingle.timer = 0;
            if (animatronics.jingle.loc === 'CAM07') animatronics.jingle.loc = 'CAM05';
            else if (animatronics.jingle.loc === 'CAM05') animatronics.jingle.loc = 'OFFICE_LEFT_VENT';
        }
    }

    function renderOffice() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Base Office Color
        ctx.fillStyle = state.blackout ? '#020202' : '#12121c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Front Window Spatial Setup
        const winW = canvas.width * 0.42;
        const winH = canvas.height * 0.38;
        const winX = (canvas.width - winW) / 2;
        const winY = canvas.height * 0.15;

        // Window Background & Frame
        ctx.fillStyle = '#050a05';
        ctx.fillRect(winX, winY, winW, winH);
        ctx.strokeStyle = '#252525';
        ctx.lineWidth = 8;
        ctx.strokeRect(winX, winY, winW, winH);

        // Jolly at Front Observation Window
        if (animatronics.jolly.loc === 'OFFICE_FRONT' && !state.shutterClosed && !state.blackout) {
            ctx.fillStyle = '#44aa44'; // Lime Green body
            ctx.fillRect(winX + winW / 2 - 40, winY + winH - 130, 80, 130);
            ctx.fillStyle = '#ff00ff'; // Neon Magenta eyes
            ctx.fillRect(winX + winW / 2 - 25, winY + winH - 110, 14, 14);
            ctx.fillRect(winX + winW / 2 + 11, winY + winH - 110, 14, 14);
        }

        // Heavy Steel Shutter Component
        if (state.shutterClosed) {
            ctx.fillStyle = '#22222b';
            ctx.fillRect(winX, winY, winW, winH);
            ctx.fillStyle = '#111';
            for (let i = 0; i < winH; i += 22) {
                ctx.fillRect(winX, winY + i, winW, 3);
            }
        }

        // Left Maintenance Vent
        const ventX = 40, ventY = canvas.height * 0.4, ventS = 130;
        ctx.fillStyle = state.ventSealHeld ? '#00aaaa' : '#080808';
        ctx.fillRect(ventX, ventY, ventS, ventS);
        ctx.strokeStyle = '#1e3333';
        ctx.lineWidth = 6;
        ctx.strokeRect(ventX, ventY, ventS, ventS);

        // Jingle at Left Vent
        if (animatronics.jingle.loc === 'OFFICE_LEFT_VENT' && !state.ventSealHeld && !state.blackout) {
            ctx.fillStyle = '#883311'; // Matted Rust-Red Fur
            ctx.fillRect(ventX + 30, ventY + 40, 70, 70);
            ctx.fillStyle = '#ffff00'; // Yellow center eyes
            ctx.fillRect(ventX + 48, ventY + 58, 6, 6);
            ctx.fillRect(ventX + 76, ventY + 58, 6, 6);
        }

        // Right Entryway Door
        const doorX = canvas.width - 170, doorY = canvas.height * 0.28, doorW = 130, doorH = canvas.height * 0.55;
        ctx.fillStyle = '#050505';
        ctx.fillRect(doorX, doorY, doorW, doorH);

        // Flash Beacon Visual Beam & Junior Detection
        if (state.flashActive) {
            ctx.fillStyle = 'rgba(255, 255, 210, 0.85)';
            ctx.fillRect(doorX - 120, doorY - 40, doorW + 240, doorH + 80);

            if (animatronics.junior.loc === 'OFFICE_RIGHT') {
                ctx.fillStyle = '#5c3511'; // Glossy Brown Bear
                ctx.fillRect(doorX + 20, doorY + 60, 90, 170);
                ctx.fillStyle = '#00ffff'; // Glowing Neon-Blue eyes
                ctx.fillRect(doorX + 35, doorY + 85, 12, 12);
                ctx.fillRect(doorX + 78, doorY + 85, 12, 12);
            }
        }
    }

    function triggerBlackout() {
        state.blackout = true;
        state.shutterClosed = false;
        state.monitorActive = false;
        monitorOverlay.style.display = 'none';
        btnShutter.classList.remove('active');
        btnMonitor.classList.remove('active');
        playBeep(50, 'sawtooth', 1.0);

        // Grace timer until Junior blackout jumpscare
        setTimeout(() => {
            if (!state.gameOver) triggerJumpscare('Junior (Blackout)');
        }, 15000);
    }

    function triggerJumpscare(threatName) {
        state.gameOver = true;
        ctx.fillStyle = '#aa0000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 42px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`GAME OVER - KILLED BY ${threatName.toUpperCase()}`, canvas.width / 2, canvas.height / 2);
        playBeep(60, 'sawtooth', 2.5);
    }

    function triggerWin() {
        state.gameOver = true;
        ctx.fillStyle = '#00aa00';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 42px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('6:00 AM - NIGHT SURVIVED', canvas.width / 2, canvas.height / 2);
        playBeep(440, 'sine', 1.5);
    }

    // Launch Loop
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
